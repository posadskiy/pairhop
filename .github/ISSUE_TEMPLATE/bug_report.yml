name: Bug Report
description: Something in PairHop isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the menu bar icon, then Use here
        2. The keyboard does not connect
        3. ...
    validations:
      required: true

  - type: input
    id: pairhop-version
    attributes:
      label: PairHop version
      description: Shown in Settings → About, or filled in for you by Settings → Report…
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. Version 26.1 (Build 25B78)"
    validations:
      required: true

  - type: dropdown
    id: mac-arch
    attributes:
      label: Mac chip
      options:
        - Apple Silicon (M-series)
    validations:
      required: true

  - type: dropdown
    id: devices
    attributes:
      label: What device(s) were you switching?
      multiple: true
      options:
        - Magic Keyboard
        - Magic Trackpad
        - Magic Mouse
        - Other Bluetooth accessory
    validations:
      required: false

  - type: textarea
    id: error-message
    attributes:
      label: Error message (if any)
      description: PairHop's error boxes have a copy button — paste the exact text here.
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Troubleshooting → Save Diagnostics… writes a text file with PairHop's
        log and the Bluetooth messages for your accessories. Drag it into this box.
        It lists device names and addresses; open it first and remove anything you don't want public.
        Bluetooth problems often depend on the accessory, so this is the fastest way to a fix.
    validations:
      required: false
